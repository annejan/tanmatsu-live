name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  host-tests:
    # The pattern engine and the voice engine have no ESP-IDF dependency on
    # purpose, so the parts most likely to be wrong are testable with no badge
    # plugged in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: make -C test/host check

      - uses: actions/upload-artifact@v4
        with:
          name: beat
          path: test/host/beat.wav
          if-no-files-found: error

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Voice engine throughput
        run: make -C test/host bench

  firmware:
    # Host tests run on x86 and cannot see target specific problems. This job
    # exists because a 128 bit integer in the fraction comparison compiled
    # happily on the host and does not exist at all on 32 bit RISC-V.
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Build for Tanmatsu
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build/tanmatsu -DDEVICE=tanmatsu \
            -DSDKCONFIG_DEFAULTS="sdkconfigs/general;sdkconfigs/tanmatsu" \
            -DSDKCONFIG=sdkconfig_tanmatsu \
            -DIDF_TARGET=esp32p4 -DFAT=0 \
            build

      - uses: actions/upload-artifact@v4
        with:
          name: tanmatsu-live.bin
          path: build/tanmatsu/tanmatsu-live.bin
          if-no-files-found: error
